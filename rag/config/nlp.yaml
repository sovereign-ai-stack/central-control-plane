# Persian NLP layer (Phase 5).
#
# Defaults are conservative (enabled: false) for regression baseline.
# Can be enabled via RAG_NLP_ENABLED=true in production .env.
nlp:
  enabled: false
  normalization_version: fa-norm-v2
  fold_digits: false
  morphology:
    enabled: false
    backend: rule_based      # rule_based | hazm (hazm is an optional extra)
    plural: true             # کتاب‌ها / کتابهای -> کتاب
    possessive: true         # کتابمان -> کتاب
    comparative: true        # بزرگ‌ترین -> بزرگ
    verbs: true              # می‌روم -> رفتن
    min_stem_length: 3       # over-stemming guard
