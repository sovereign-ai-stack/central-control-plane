# Production embedding model.
#
# Selected: BAAI/bge-m3 — see benchmarks/persian/reports/selection-decision.md
# for the evidence and the signed gate checklist.
#
# The revision is pinned so a silent upstream change cannot alter embeddings
# under an existing index. Changing model_id OR revision invalidates every
# stored vector and REQUIRES a full reindex.
embedding:
  backend: sentence-transformers
  model_id: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  device: cpu
  batch_size: 32
  normalize_embeddings: true
  torch_seed: 42
  production: true

  # bge-m3 is a ~2 GB checkpoint: it takes tens of seconds to load from a warm
  # cache and minutes on a cold one. The loader's fail-fast default is far
  # shorter than that, so without a real budget here the load always times out.
  load_timeout_sec: 300

  # On a load failure, fail startup instead of falling back to
  # StubEmbeddingModel. The stub returns 384-dimensional hashes of the input:
  # they embed nothing, they do not match this model's 1024-dimensional index,
  # and retrieval built on them looks healthy while returning noise. A service
  # that cannot load its embedding model must not answer queries.
  strict_load: true

  # bge-m3 is symmetric: it needs no query/document prefixes, unlike e5, which
  # requires "query: " / "passage: ". One less way for the query and document
  # paths to drift apart.
  query_prefix: null
  document_prefix: null

  preprocessing:
    normalization_version: fa-norm-v1
    digit_mode: preserve
