services:
  # 1. Primary PostgreSQL Database (LiteLLM Tokens, Keys & Storage)
  postgres:
    image: postgres:16-alpine
    container_name: enterprise-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. Redis In-Memory Cache (Sub-millisecond Rate Limiting & Response Caching)
  redis:
    image: redis:7-alpine
    container_name: enterprise-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # 3. LiteLLM Reverse Proxy (Built locally in < 150MB with offline Prisma DB ORM)
  litellm:
    build: ./litellm
    container_name: litellm-proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-lite-master-1234}
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm_secure_password}@postgres:5432/${POSTGRES_DB:-litellm}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LITELLM_LOG: ${LITELLM_LOG:-INFO}
      STORE_MODEL_IN_DB: "True"
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-master}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-master}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
    command: ["--config", "/app/config.yaml", "--host", "0.0.0.0", "--port", "4000", "--num_workers", "1"]
    restart: unless-stopped

  # 4. Central Node Registry (Auto-Registration & Dynamic Node Health Tracking)
  registry:
    build: ./registry
    container_name: central-node-registry
    ports:
      - "${REGISTRY_PORT:-8200}:8200"
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-lite-master-1234}
      REGISTRY_SECRET: ${REGISTRY_SECRET:-}
      NODE_TIMEOUT_SECONDS: ${NODE_TIMEOUT_SECONDS:-60}
    depends_on:
      - litellm
    restart: unless-stopped

  # 5. Semantic Router (Intent Classifier & Smart Request Dispatcher)
  semantic:
    build: ./semantic
    container_name: semantic-router
    ports:
      - "127.0.0.1:${SEMANTIC_PORT:-8300}:8300"
    environment:
      LLM_GATEWAY_URL: http://litellm:4000
      LLM_GATEWAY_KEY: ${LITELLM_MASTER_KEY:-sk-lite-master-1234}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-general-model}
    depends_on:
      - litellm
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 6. Central AI Gateway Backend API (with in-process RAG subsystem)
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: central-ai-gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm_secure_password}@postgres:5432/${POSTGRES_DB:-litellm}
      LITELLM_URL: http://litellm:4000
      REGISTRY_URL: http://registry:8200
      REGISTRY_SECRET: ${REGISTRY_SECRET:-}
      SEMANTIC_URL: http://semantic:8300
      RAG_VECTOR_STORE_BACKEND: ${RAG_VECTOR_STORE_BACKEND:-weaviate}
      RAG_WEAVIATE_URL: http://weaviate:8080
      RAG_WEAVIATE_GRPC_PORT: 50051
      RAG_EMBEDDING_DEVICE: ${RAG_EMBEDDING_DEVICE:-cpu}
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-sentence_transformers}
      RAG_NLP_ENABLED: ${RAG_NLP_ENABLED:-true}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      RAG_EMBEDDING_MODEL_PATH: ${RAG_EMBEDDING_MODEL_PATH:-/models}
      INGESTION_WORKERS: ${INGESTION_WORKERS:-4}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      APP_SECRET_PATH: ${APP_SECRET_PATH:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-8054958d-e8f3-4661-912c-69a351a5156d}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-468e625d-5c34-45c6-aca2-a0b24877b3f2}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_RELEASE: ${LANGFUSE_RELEASE:-v2.0.0-production}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      ADMIN_INITIAL_EMAIL: ${ADMIN_INITIAL_EMAIL:-admin@sovereign.local}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-admin}
      ADMIN_INITIAL_NAME: ${ADMIN_INITIAL_NAME:-مهدی جعفری}
    volumes:
      - ${MODEL_DIR:-../models}:/models:ro
      - ./app:/app/app
      - ./rag:/app/rag
      - ./server.py:/app/server.py
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      registry:
        condition: service_started
      semantic:
        condition: service_started
      weaviate:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # 7. Modern Sovereign Enterprise Web UI (Next.js)
  frontend:
    build: ./frontend
    container_name: sovereign-web-frontend
    ports:
      - "${UI_PORT:-8400}:3000"
    environment:
      BACKEND_URL: http://gateway:8000
      APP_SECRET_PATH: ${APP_SECRET_PATH:-}
      NEXT_PUBLIC_APP_SECRET_PATH: ${APP_SECRET_PATH:-}
      BACKEND_APP_SECRET_PATH: ${APP_SECRET_PATH:-}
      NEXT_PUBLIC_LANGFUSE_URL: ${NEXT_PUBLIC_LANGFUSE_URL:-}
      NEXT_PUBLIC_LITELLM_URL: ${NEXT_PUBLIC_LITELLM_URL:-}
    depends_on:
      - gateway
    restart: unless-stopped

  # 8. Langfuse Graphical Observability (Open http://localhost:3000 to sign up)
  langfuse:
    image: langfuse/langfuse:2
    container_name: langfuse-observability
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm_secure_password}@postgres:5432/${POSTGRES_DB:-litellm}
      NEXTAUTH_URL: ${LANGFUSE_NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-my_secret_enterprise_nextauth_key_12345}
      SALT: ${LANGFUSE_SALT:-my_salt_secret_12345}
      TELEMETRY_ENABLED: "false"
    restart: unless-stopped

  # 9. Weaviate Vector Database (External infrastructure for production vector indexing)
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.36.1
    container_name: enterprise-weaviate
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEAVIATE_PORT:-18080}:8080"
      - "127.0.0.1:${WEAVIATE_GRPC_PORT:-18081}:50051"
    environment:
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: ${WEAVIATE_ANONYMOUS_ACCESS:-"true"}
      AUTHENTICATION_APIKEY_ENABLED: ${WEAVIATE_APIKEY_ENABLED:-"true"}
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: ${WEAVIATE_API_KEY:-"sk-weaviate-master-key-1234"}
      AUTHENTICATION_APIKEY_USERS: "admin"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      QUERY_DEFAULTS_LIMIT: "25"
      DISABLE_TELEMETRY: "true"
    volumes:
      - weaviate-data:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/v1/.well-known/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  weaviate-data:
