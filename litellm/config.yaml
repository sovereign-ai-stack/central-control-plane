# ==============================================================================
# LiteLLM Enterprise Proxy Configuration (Role-Based Dynamic Routing)
# ==============================================================================

model_list: []

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 3
  timeout: 300
  cooldown_time: 30
  allowed_fails: 1
  enable_pre_call_checks: true
  fallbacks:
    - "coding-model": ["reasoning-model", "general-model"]
    - "reasoning-model": ["coding-model", "general-model"]
    - "rag-model": ["general-model"]

litellm_settings:
  drop_params: true
  request_timeout: 300
  telemetry: false
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    supported_call_types: ["acompletion", "completion"]
    ttl: 3600
  success_callback: ["database", "langfuse"]
  failure_callback: ["database", "langfuse"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  disable_swagger_ui: false
