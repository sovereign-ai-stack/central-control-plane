# Embedding Model Candidates — Benchmark Configuration
#
# Production model: M2-bge-m3, selected 2026-09-01.
# Evidence and signed gate checklist: ../reports/selection-decision.md

candidates:
  - id: M0-baseline
    model_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
    revision: null
    backend: sentence-transformers
    role: baseline
    query_prefix: null
    document_prefix: null
    expected_dimension: 384

  - id: M1-e5-large
    model_id: intfloat/multilingual-e5-large
    revision: null
    backend: sentence-transformers
    role: candidate
    query_prefix: "query: "
    document_prefix: "passage: "
    expected_dimension: 1024

  - id: M2-bge-m3
    model_id: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    production: true
    backend: sentence-transformers
    role: candidate
    query_prefix: null
    document_prefix: null
    expected_dimension: 1024

  - id: M3-persian-heydari
    model_id: heydariAI/persian-embeddings
    revision: null
    backend: sentence-transformers
    role: candidate
    architecture: XLM-RoBERTa-base
    description: Fine-tuned for Persian sentence/paragraph embeddings
    query_prefix: null
    document_prefix: null
    expected_dimension: null
    load_locally: true
    production: false

benchmark:
  normalization_version: fa-norm-v1
  seed: 42
  device: cpu
  batch_size: 32
  normalize_embeddings: true
  k_values: [1, 3, 5, 10, 20]
  ndcg_k_values: [5, 10]
  selection:
    primary_metric: recall_at_5
    tiebreaker: mrr
    max_relative_gap: 0.15
  category_breakdown:
    - semantic
    - paraphrase
    - mixed_language
    - technical
    - short_query
    - long_query
    - zwnj
    - arabic_char_variants
