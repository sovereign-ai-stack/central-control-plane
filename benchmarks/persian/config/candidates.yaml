  - id: M3-persian-heydari
    model_id: heydariAI/persian-embeddings
    revision: null
    backend: sentence-transformers
    role: candidate
    architecture: XLM-RoBERTa-base
    description: Fine-tuned for Persian sentence/paragraph embeddings
